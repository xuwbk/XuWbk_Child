# ============================================================
# XuWbk WordPress 站点 .htaccess 安全加固 (Apache)
# 适用方式：追加到站点根目录 .htaccess 文件顶部
# 创建日期：2026-07-11
# ============================================================

# ---------- 安全响应头 ----------
<IfModule mod_headers.c>
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
</IfModule>

# ---------- 禁止访问敏感文件 ----------
<FilesMatch "(wp-config\.php|\.htaccess|readme\.html|license\.txt)">
    Require all denied
</FilesMatch>

# ---------- 禁止执行 uploads 目录下的 PHP ----------
<DirectoryMatch "/wp-content/uploads/">
    <FilesMatch "\.php$">
        Require all denied
    </FilesMatch>
</DirectoryMatch>

# ---------- 禁止访问 XML-RPC ----------
<FilesMatch "xmlrpc\.php$">
    Require all denied
</FilesMatch>

# ---------- 隐藏服务器签名 ----------
ServerSignature Off

# ---------- 静态资源浏览器缓存 ----------
<IfModule mod_expires.c>
    ExpiresActive On
    # CSS/JS
    ExpiresByType text/css "access plus 30 days"
    ExpiresByType application/javascript "access plus 30 days"
    # 图片
    ExpiresByType image/png "access plus 30 days"
    ExpiresByType image/jpeg "access plus 30 days"
    ExpiresByType image/webp "access plus 30 days"
    ExpiresByType image/gif "access plus 30 days"
    ExpiresByType image/svg+xml "access plus 30 days"
    ExpiresByType image/x-icon "access plus 30 days"
    # 字体
    ExpiresByType font/woff "access plus 30 days"
    ExpiresByType font/woff2 "access plus 30 days"
    ExpiresByType application/x-font-ttf "access plus 30 days"
</IfModule>

# ---------- Gzip 压缩 ----------
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript
    AddOutputFilterByType DEFLATE application/javascript application/json application/xml
    AddOutputFilterByType DEFLATE image/svg+xml application/x-font-ttf font/opentype
</IfModule>
