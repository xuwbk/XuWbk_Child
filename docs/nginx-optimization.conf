# ============================================================
# XuWbk WordPress 站点 Nginx 优化配置
# 适用方式：复制到宝塔面板 → 网站 → 配置文件，加入 server 块中
# 创建日期：2026-07-11
# ============================================================

# ---------- Gzip 压缩（在 http 块或 server 块中配置） ----------
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/rss+xml text/javascript image/svg+xml application/x-font-ttf font/opentype;

# ---------- 安全规则 ----------

# 1. 禁止访问敏感文件
location ~* (wp-config\.php|\.htaccess|readme\.html|license\.txt|changelog\.txt) {
    deny all;
}

# 2. 禁止直接执行 uploads 目录下的 PHP 文件
location ~* /wp-content/uploads/.*\.php$ {
    deny all;
}

# 3. 禁止访问 XML-RPC（ZIBLL 主题已默认禁用）
location = /xmlrpc.php {
    deny all;
    access_log off;
    log_not_found off;
}

# 4. 阻止恶意扫描
location ~* (\.sql|\.tar|\.tar\.gz|\.zip|\.rar|\.7z)$ {
    deny all;
}

# 5. 限制 wp-includes 直接访问（仅允许 CSS/JS/图片）
location ~* /wp-includes/ {
    location ~* \.(css|js|svg|woff|woff2|ttf|eot|png|jpg|jpeg|gif|ico)$ {
        # 允许静态资源
    }
    location ~* \.php$ {
        deny all;
    }
}

# ---------- 安全响应头 ----------
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# ---------- 静态资源浏览器缓存 ----------
location ~* \.(css|js|svg|woff|woff2|ttf|eot|ico)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
}

location ~* \.(png|jpg|jpeg|gif|webp)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# ---------- WordPress 固定链接 ----------
location / {
    try_files $uri $uri/ /index.php?$args;
}

